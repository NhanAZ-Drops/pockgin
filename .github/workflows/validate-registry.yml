name: Validate Registry

on:
  pull_request:
    paths:
      - "registry/plugins/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install scripts
        run: |
          git clone https://github.com/pockgin/scripts.git /tmp/pockgin-scripts
          cd /tmp/pockgin-scripts && npm install

      - name: Validate registry entries
        env:
          REGISTRY_DIR: ${{ github.workspace }}/registry/plugins
        run: node /tmp/pockgin-scripts/validate-registry.js
